<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- The Cue mark (public/branding/cue-logo.png), single colour. The
       embedded style flips it white on dark browser chrome so the same
       mark stays visible in both tab themes. Geometry matches
       src/components/BrandMark.tsx. -->
  <style>
    .mark { stroke: #111111; }
    .dot { fill: #111111; }
    @media (prefers-color-scheme: dark) {
      .mark { stroke: #FFFFFF; }
      .dot { fill: #FFFFFF; }
    }
  </style>
  <path class="mark" d="M68.82 70.9A28.125 28.125 0 1 1 68.82 29.1" fill="none" stroke-width="16.8" stroke-linecap="round"/>
  <circle class="dot" cx="50" cy="50" r="5.37"/>
</svg>
