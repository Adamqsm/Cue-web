<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- The Cue mark from the brand logo (public/brand/logo-ink.png), black-only.
       The embedded style flips it white on dark browser chrome so the same
       mark stays visible in both tab themes. -->
  <style>
    .ring { stroke: #17130F; }
    @media (prefers-color-scheme: dark) {
      .ring { stroke: #FFFFFF; }
    }
  </style>
  <g fill="none" stroke-linecap="round">
    <circle class="ring" cx="50" cy="50" r="38" pathLength="100" stroke-width="13" stroke-dasharray="72 28" stroke-dashoffset="-14"/>
    <circle class="ring" cx="50" cy="50" r="17" pathLength="100" stroke-width="13" stroke-dasharray="70 30" stroke-dashoffset="-15"/>
  </g>
</svg>
